name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/template/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run verify -- --effects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-screenshots
          path: assets/template/verify
          retention-days: 7
